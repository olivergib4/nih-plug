[package]
name = "onsetguard"
version = "1.0.0"
edition = "2021"
authors = ["OGII"]
license = "GPL-3.0-or-later"
description = "Bus clipper with hit analysis and reference comparison"
homepage = "https://github.com/olivergib4/nih-plug/tree/master/plugins/onsetguard"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
nih_plug = { path = "../../", features = ["assert_process_allocs", "standalone"] }
nih_plug_vizia = { path = "../../nih_plug_vizia" }
realfft = "3.0"
atomic_float = "0.1"
triple_buffer = "6.2"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "pcm", "isomp4", "aac", "ogg", "vorbis"] }


[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.14", default-features = false }
